function drawCherryBomb(x, y, p) {
    const cx = x + CONFIG.CELL_W/2, cy = y + CONFIG.CELL_H/2 + 5;
    const t = p.animTime;
    const timeUntilExplosion = p.actionTimer;
    const flashing = timeUntilExplosion < 800;
    const flashIntensity = flashing ? (Math.sin(t * 30) * 0.5 + 0.5) : 0;
    const mainColor = flashing ? `rgb(${200 + flashIntensity * 55}, ${30 + flashIntensity * 80}, ${30 + flashIntensity * 50})` : '#c62828';
    const scale = flashing ? 1 + flashIntensity * 0.15 : 1;
    
    ctx.fillStyle = mainColor;
    ctx.beginPath(); ctx.arc(cx - 12, cy + 8, 18 * scale, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 12, cy + 8, 18 * scale, 0, Math.PI*2); ctx.fill();
    
    ctx.strokeStyle = '#558b2f'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(cx - 12, cy - 10); ctx.quadraticCurveTo(cx, cy - 25, cx + 12, cy - 10); ctx.stroke();
    
    ctx.fillStyle = '#7cb342';
    ctx.beginPath(); ctx.ellipse(cx + 3, cy - 25, 9, 4, 0.3, 0, Math.PI*2); ctx.fill();
    
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath(); ctx.arc(cx - 16, cy + 3, 5, 0, Math.PI*2); ctx.arc(cx + 8, cy + 3, 5, 0, Math.PI*2); ctx.fill();
    
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(cx - 10, cy + 4, 4, 0, Math.PI*2); ctx.arc(cx + 14, cy + 4, 4, 0, Math.PI*2); ctx.fill();
    
    ctx.fillStyle = '#3e2723';
    ctx.beginPath();
    ctx.moveTo(cx - 13, cy + 2); ctx.lineTo(cx - 7, cy + 5); ctx.lineTo(cx - 13, cy + 6); ctx.closePath();
    ctx.moveTo(cx + 17, cy + 2); ctx.lineTo(cx + 11, cy + 5); ctx.lineTo(cx + 17, cy + 6); ctx.closePath();
    ctx.fill();
    
    if (flashing) {
        for (let i = 0; i < 4; i++) {
            const sx = cx + (Math.random() - 0.5) * 50;
            const sy = cy + (Math.random() - 0.5) * 35;
            ctx.fillStyle = ['#ffeb3b', '#ffc107', '#ff5722'][Math.floor(Math.random()*3)];
            ctx.beginPath(); ctx.arc(sx, sy, 2 + Math.random() * 2, 0, Math.PI*2); ctx.fill();
        }
    }
}

// 棉花：蓬松白色棉团，带短梗（堆叠三阶：棉花→棉球→棉被）
function drawCotton(x, y, p) {
    const cx = x + CONFIG.CELL_W/2, cy = y + CONFIG.CELL_H/2 + 5;
    const t = p.animTime;
    const breathe = Math.sin(t * 2) * 1.5;
    const jitter = p.targetZombies && p.targetZombies.length > 0 ? Math.sin(t * 20) * 1 : 0;
    const s = p.stack || 1;

    // 茎（堆叠越高茎越粗）
    ctx.fillStyle = '#558b2f';
    ctx.fillRect(cx - 2.5 - s*0.5, cy + 5, 5 + s, 28);
    // 叶
    ctx.fillStyle = '#7cb342';
    ctx.beginPath(); ctx.ellipse(cx - 12 - s*2, cy + 22, 9 + s*2, 4, -0.4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + 12 + s*2, cy + 22, 9 + s*2, 4, 0.4, 0, Math.PI*2); ctx.fill();

    // 三阶尺寸与颜色
    const sizes = [
        { r: 12, extra: 0, color: '#eceff1', glow: 'rgba(255,255,255,0.6)' },   // 棉花
        { r: 16, extra: 4, color: '#e8eaf6', glow: 'rgba(179,229,252,0.6)' },  // 棉球
        { r: 20, extra: 8, color: '#fff8e1', glow: 'rgba(255,224,130,0.6)' },  // 棉被
    ];
    const cfg = sizes[Math.min(s, 3) - 1];

    // 堆叠3层时加光晕
    if (s >= 3) {
        const hl = ctx.createRadialGradient(cx, cy - 4, 5, cx, cy - 4, 50);
        hl.addColorStop(0, 'rgba(255, 235, 59, 0.2)');
        hl.addColorStop(1, 'rgba(255, 235, 59, 0)');
        ctx.fillStyle = hl;
        ctx.beginPath(); ctx.arc(cx, cy - 4, 50, 0, Math.PI*2); ctx.fill();
    }
    // 堆叠2层时加淡蓝光
    if (s >= 2) {
        const hl = ctx.createRadialGradient(cx, cy - 4, 5, cx, cy - 4, 35);
        hl.addColorStop(0, 'rgba(129, 212, 250, 0.15)');
        hl.addColorStop(1, 'rgba(129, 212, 250, 0)');
        ctx.fillStyle = hl;
        ctx.beginPath(); ctx.arc(cx, cy - 4, 35, 0, Math.PI*2); ctx.fill();
    }

    // 棉团：多个圆叠加（尺寸随stack增大）
    const blobs = [
        { dx: -cfg.r, dy: -6, r: cfg.r },
        { dx: cfg.r, dy: -6, r: cfg.r },
        { dx: 0, dy: -cfg.r - 4, r: cfg.r + 2 },
        { dx: -cfg.r*0.6, dy: 4, r: cfg.r - 1 },
        { dx: cfg.r*0.6, dy: 4, r: cfg.r - 1 },
        { dx: 0, dy: -2, r: cfg.r + 2 },
    ];
    for (const b of blobs) {
        const gx = cx + b.dx + jitter;
        const gy = cy + b.dy + breathe;
        ctx.fillStyle = cfg.color;
        ctx.beginPath(); ctx.arc(gx, gy, b.r, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = cfg.glow;
        ctx.beginPath(); ctx.arc(gx - b.r*0.3, gy - b.r*0.3, b.r*0.45, 0, Math.PI*2); ctx.fill();
    }
    // 小绒毛点
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    for (let i = 0; i < 6 + s*2; i++) {
        const a = i / (6 + s*2) * Math.PI * 2;
        const rd = 16 + s*4;
        ctx.beginPath(); ctx.arc(cx + Math.cos(a)*rd + jitter, cy - 4 + Math.sin(a)*rd*0.7 + breathe, 1.5 + s*0.3, 0, Math.PI*2); ctx.fill();
    }

    // 堆叠标签
    const labels = ['', '棉', '球', '被'];
    ctx.fillStyle = s >= 3 ? '#ff8f00' : (s >= 2 ? '#29b6f6' : 'rgba(255,255,255,0.7)');
    ctx.font = `bold ${10 + s*2}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(labels[s], cx + jitter, cy + 20 + breathe);
}

// ============ 僵尸绘制 ============
function drawZombie(z) {
    const x = z.x;
    const baseY = CONFIG.LAWN_Y + z.row * CONFIG.CELL_H + CONFIG.CELL_H / 2 + 12;
    const t = z.animTime;
    const walking = !z.eating;
    // 跑步僵尸冲刺时步频更快
    const stepFreq = (z.type === 'runner' && !z.chargeDone) ? 9 : 5;
    const bob = walking ? Math.sin(t * stepFreq) * (z.type === 'runner' && !z.chargeDone ? 2.5 : 1.5) : 0;
    const legSwing = walking ? Math.sin(t * stepFreq) * 4 : 0;
    const armSwing = walking ? Math.sin(t * stepFreq) * 0.15 : 0;
    const eatBob = z.eating ? Math.abs(Math.sin(t * 12)) * 2 : 0;
    const headTilt = Math.sin(t * 2) * 0.03;

    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.ellipse(x, baseY + 33, 20, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    // 后腿
    ctx.fillStyle = '#37474f';
    ctx.fillRect(x - 7, baseY + 8, 5, 22 + legSwing);
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(x - 9, baseY + 28 + legSwing, 9, 4);

    // 后手臂
    ctx.save();
    ctx.translate(x - 11, baseY - 14 + bob);
    ctx.rotate(0.15 + armSwing);
    ctx.fillStyle = '#8bc34a';
    ctx.fillRect(-3, 0, 6, 14);
    ctx.fillStyle = '#7cb342';
    ctx.beginPath();
    ctx.arc(0, 15, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 身体（跑步僵尸用深红衣区分）
    ctx.fillStyle = z.type === 'runner' ? '#4e342e' : '#5d4037';
    roundRect(ctx, x - 11, baseY - 18 + bob, 22, 28, 5);
    ctx.fill();
    ctx.fillStyle = '#9ccc65';
    ctx.beginPath();
    ctx.moveTo(x - 4, baseY - 18 + bob);
    ctx.lineTo(x, baseY - 12 + bob);
    ctx.lineTo(x + 4, baseY - 18 + bob);
    ctx.fill();
    ctx.fillStyle = '#3e2723';
    ctx.fillRect(x - 11, baseY - 6 + bob, 22, 1);
    ctx.beginPath();
    ctx.arc(x - 4, baseY + 2 + bob, 2.5, 0, Math.PI * 2);
    ctx.arc(x + 5, baseY - 2 + bob, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#8d6e63';
    ctx.beginPath();
    ctx.arc(x, baseY + 0 + bob, 1.2, 0, Math.PI * 2);
    ctx.arc(x, baseY + 6 + bob, 1.2, 0, Math.PI * 2);
    ctx.fill();

    // 前腿
    ctx.fillStyle = '#37474f';
    ctx.fillRect(x + 2, baseY + 8, 5, 22 - legSwing);
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(x, baseY + 28 - legSwing, 9, 4);

    // 前手臂
    ctx.save();
    ctx.translate(x + 9, baseY - 12 + bob - eatBob);
    ctx.rotate(-0.1 + armSwing * 0.5);
    ctx.fillStyle = '#8bc34a';
    roundRect(ctx, 0, -3, 16, 7, 2);
    ctx.fill();
    ctx.fillStyle = '#8bc34a';
    roundRect(ctx, 14, -4, 8, 6, 2);
    ctx.fill();
    ctx.fillStyle = '#7cb342';
    ctx.beginPath();
    ctx.arc(22, -1, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#558b2f';
    ctx.fillRect(24, -4, 3, 2);
    ctx.fillRect(24, -1, 3, 2);
    ctx.fillRect(24, 2, 3, 2);
    ctx.restore();

    // 头
    ctx.save();
    ctx.translate(x, baseY - 30 + bob - eatBob * 0.5);
    ctx.rotate(headTilt);
    ctx.fillStyle = '#9ccc65';
    ctx.beginPath();
    ctx.ellipse(0, 0, 13, 15, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(85, 139, 47, 0.25)';
    ctx.beginPath();
    ctx.ellipse(3, 1, 10, 13, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#3e2723';
    ctx.beginPath();
    ctx.arc(-7, -12, 1.8, 0, Math.PI * 2);
    ctx.arc(-2, -14, 1.8, 0, Math.PI * 2);
    ctx.arc(3, -14, 1.8, 0, Math.PI * 2);
    ctx.arc(8, -12, 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(30, 20, 10, 0.4)';
    ctx.beginPath();
    ctx.ellipse(-5, -2, 4.5, 5.5, 0, 0, Math.PI * 2);
    ctx.ellipse(5, -2, 4.5, 5.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(-5, -2, 2.8, 0, Math.PI * 2);
    ctx.arc(5, -2, 2.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath();
    ctx.arc(-5.5, -1.5, 1.3, 0, Math.PI * 2);
    ctx.arc(4.5, -1.5, 1.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(85, 139, 47, 0.5)';
    ctx.beginPath();
    ctx.ellipse(0, 4, 2, 1.5, 0, 0, Math.PI * 2);
    ctx.fill();
    // 嘴：被棉花塞住时画一团棉花在嘴上
    if (z.clogged) {
        ctx.fillStyle = '#eceff1';
        ctx.beginPath();
        ctx.arc(-2, 8, 5, 0, Math.PI*2);
        ctx.arc(3, 8, 5, 0, Math.PI*2);
        ctx.arc(0, 6, 5, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.beginPath(); ctx.arc(-2, 6, 2, 0, Math.PI*2); ctx.fill();
    } else if (z.eating) {
        const mo = Math.abs(Math.sin(t * 12)) * 3 + 2.5;
        ctx.fillStyle = '#1a1a1a';
        roundRect(ctx, -5, 6, 10, mo, 1.5);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.fillRect(-4, 6, 2, 2);
        ctx.fillRect(-1, 6, 2, 2);
        ctx.fillRect(2, 6, 2, 2);
    } else {
        ctx.fillStyle = '#1a1a1a';
        roundRect(ctx, -5, 7, 10, 3.5, 1);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.fillRect(-4, 7, 2, 2);
        ctx.fillRect(2, 7, 2, 2);
    }
    ctx.fillStyle = 'rgba(244, 67, 54, 0.15)';
    ctx.beginPath();
    ctx.arc(-9, 5, 3, 0, Math.PI * 2);
    ctx.arc(9, 5, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 护甲
    if (z.type === 'cone' && z.armorHp > 0) {
        const ar = z.armorHp / z.maxArmorHp;
        const coneY = baseY - 40 + bob - eatBob * 0.5;
        ctx.fillStyle = '#ff6f00';
        ctx.beginPath();
        ctx.moveTo(x - 13, coneY);
        ctx.lineTo(x + 13, coneY);
        ctx.lineTo(x, coneY - 25);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.beginPath();
        ctx.moveTo(x - 10, coneY - 2);
        ctx.lineTo(x - 6, coneY - 2);
        ctx.lineTo(x - 1, coneY - 20);
        ctx.lineTo(x - 3, coneY - 20);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.fillRect(x - 9, coneY - 7, 18, 2);
        ctx.fillRect(x - 6, coneY - 16, 12, 2);
        if (ar < 0.5) {
            ctx.strokeStyle = '#3e2723'; ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(x - 4, coneY - 12);
            ctx.lineTo(x - 1, coneY - 5);
            ctx.lineTo(x - 5, coneY);
            ctx.stroke();
        }
    } else if (z.type === 'bucket' && z.armorHp > 0) {
        const ar = z.armorHp / z.maxArmorHp;
        const buckY = baseY - 50 + bob - eatBob * 0.5;
        ctx.fillStyle = '#90a4ae';
        roundRect(ctx, x - 16, buckY, 32, 24, 3);
        ctx.fill();
        ctx.fillStyle = '#78909c';
        ctx.beginPath();
        ctx.ellipse(x, buckY, 16, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#546e7a';
        ctx.fillRect(x - 16, buckY + 20, 32, 4);
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.fillRect(x - 14, buckY + 4, 3, 16);
        if (ar < 0.6) {
            ctx.strokeStyle = '#37474f'; ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(x - 8, buckY + 6);
            ctx.lineTo(x - 3, buckY + 14);
            ctx.lineTo(x - 6, buckY + 20);
            ctx.stroke();
        }
        if (ar < 0.3) {
            ctx.beginPath();
            ctx.moveTo(x + 6, buckY + 5);
            ctx.lineTo(x + 10, buckY + 15);
            ctx.stroke();
            ctx.fillStyle = '#546e7a';
            ctx.beginPath();
            ctx.arc(x + 8, buckY + 10, 3, 0, Math.PI * 2);
            ctx.fill();
        }
    } else if (z.type === 'flag') {
        const flagY = baseY - 50 + bob - eatBob * 0.5;
        ctx.strokeStyle = '#5d4037'; ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(x + 18, flagY - 5);
        ctx.lineTo(x + 28, baseY + 6);
        ctx.stroke();
        const fw = Math.sin(t * 4) * 3;
        ctx.fillStyle = '#e53935';
        ctx.beginPath();
        ctx.moveTo(x + 18, flagY - 5);
        ctx.lineTo(x + 34 + fw, flagY);
        ctx.lineTo(x + 28, flagY + 8);
        ctx.lineTo(x + 34 + fw, flagY + 16);
        ctx.lineTo(x + 18, flagY + 12);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.beginPath();
        ctx.moveTo(x + 18, flagY - 5);
        ctx.lineTo(x + 30 + fw, flagY);
        ctx.lineTo(x + 28, flagY + 4);
        ctx.closePath();
        ctx.fill();
    } else if (z.type === 'runner' && !z.chargeDone) {
        // 跑步僵尸冲刺时头顶画"冲刺线"提示
        const dashY = baseY - 50 + bob;
        ctx.strokeStyle = 'rgba(255,235,59,0.8)'; ctx.lineWidth = 2;
        for (let i = 0; i < 3; i++) {
            ctx.beginPath();
            ctx.moveTo(x + 16 + i*6, dashY - i*3);
            ctx.lineTo(x + 24 + i*6, dashY - i*3);
            ctx.stroke();
        }
    }

    // 减速
    if (z.slowTime > 0) {
        ctx.fillStyle = 'rgba(79, 195, 247, 0.25)';
        ctx.beginPath();
        ctx.ellipse(x, baseY - 15 + bob, 26, 38, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#e1f5fe';
        ctx.font = '12px sans-serif';
        ctx.fillText('❄', x - 18, baseY - 18 + bob);
        ctx.fillText('❄', x + 10, baseY - 22 + bob);
        ctx.fillText('❄', x - 4, baseY - 48 + bob);
        ctx.fillText('❄', x - 8, baseY + 12 + bob);
    }

    // 受伤闪烁
    if (z.flashTime > 0) {
        ctx.fillStyle = `rgba(255, 80, 80, ${z.flashTime / 100 * 0.5})`;
        ctx.beginPath();
        ctx.ellipse(x, baseY - 15 + bob, 26, 38, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    // 血量条
    const totalHp = z.maxHp + z.maxArmorHp;
    const currentHp = z.hp + z.armorHp;
    if (currentHp < totalHp) {
        const by = baseY - 52 + bob;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(x - 16, by, 32, 4);
        const r = currentHp / totalHp;
        ctx.fillStyle = r > 0.5 ? '#76ff03' : (r > 0.25 ? '#ffc107' : '#f44336');
        ctx.fillRect(x - 16, by, 32 * r, 4);
    }
}

// ============ 子弹绘制 ============
function drawBullet(b) {
    for (let i = 0; i < b.trail.length; i++) {
        const t = b.trail[i];
        const a = i / b.trail.length * 0.5;
        ctx.fillStyle = b.isIce ? `rgba(79, 195, 247, ${a})` : `rgba(139, 195, 74, ${a})`;
        ctx.beginPath(); ctx.arc(t.x, t.y, 4 + i * 0.3, 0, Math.PI*2); ctx.fill();
    }
    const grad = ctx.createRadialGradient(b.x - 2, b.y - 2, 1, b.x, b.y, 8);
    if (b.isIce) {
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.5, '#81d4fa');
        grad.addColorStop(1, '#0277bd');
    } else {
        grad.addColorStop(0, '#dcedc8');
        grad.addColorStop(0.5, '#8bc34a');
        grad.addColorStop(1, '#33691e');
    }
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(b.x, b.y, 8, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath(); ctx.arc(b.x - 2, b.y - 2, 2, 0, Math.PI*2); ctx.fill();
}

// ============ 阳光绘制 ============
function drawSun(s) {
    const t = performance.now() / 500;
    const pulse = 1 + Math.sin(t) * 0.05;
    const alpha = s.life < 2000 ? s.life / 2000 : 1;
    
    ctx.save();
    ctx.globalAlpha = alpha;
    
    // 鼠标悬停高亮
    const hover = Math.hypot(state.mouseX - s.x, state.mouseY - s.y) < 32;
    if (hover) {
        const hl = ctx.createRadialGradient(s.x, s.y, 5, s.x, s.y, 40);
        hl.addColorStop(0, 'rgba(255, 235, 59, 0.5)');
        hl.addColorStop(0.5, 'rgba(255, 193, 7, 0.3)');
        hl.addColorStop(1, 'rgba(255, 193, 7, 0)');
        ctx.fillStyle = hl;
        ctx.beginPath(); ctx.arc(s.x, s.y, 40, 0, Math.PI*2); ctx.fill();
    }
    
    const hg = ctx.createRadialGradient(s.x, s.y, 10, s.x, s.y, 30);
    hg.addColorStop(0, 'rgba(255, 235, 59, 0.6)');
    hg.addColorStop(1, 'rgba(255, 235, 59, 0)');
    ctx.fillStyle = hg;
    ctx.beginPath(); ctx.arc(s.x, s.y, 30 * pulse, 0, Math.PI*2); ctx.fill();
    
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(t);
    ctx.fillStyle = 'rgba(255, 193, 7, 0.85)';
    for (let i = 0; i < 8; i++) {
        ctx.rotate(Math.PI / 4);
        ctx.beginPath();
        ctx.moveTo(0, -12); ctx.lineTo(-3, -22); ctx.lineTo(3, -22); ctx.closePath();
        ctx.fill();
    }
    ctx.restore();
    
    // 高亮时放大阳光
    const extraPulse = hover ? 1.2 : 1;
    const g = ctx.createRadialGradient(s.x - 4, s.y - 4, 2, s.x, s.y, 15);
    g.addColorStop(0, '#fffde7');
    g.addColorStop(0.4, '#ffeb3b');
    g.addColorStop(1, '#ff8f00');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(s.x, s.y, 15 * pulse * extraPulse, 0, Math.PI*2); ctx.fill();
    
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath(); ctx.arc(s.x - 5, s.y - 5, 4, 0, Math.PI*2); ctx.fill();
    
    ctx.restore();
}

function drawExplosion(e) {
    const t = 1 - e.life / e.maxLife;
    const a = 1 - t;
    const g = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.radius);
    g.addColorStop(0, `rgba(255, 255, 200, ${a})`);
    g.addColorStop(0.3, `rgba(255, 152, 0, ${a * 0.85})`);
    g.addColorStop(0.7, `rgba(244, 67, 54, ${a * 0.5})`);
    g.addColorStop(1, `rgba(244, 67, 54, 0)`);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = `rgba(255, 235, 59, ${a * 0.7})`;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.radius * 0.5, 0, Math.PI*2); ctx.fill();
}

function drawParticle(p) {
    const a = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.globalAlpha = a;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
}

// ============ 关卡选择 UI ============
const PROGRESS_KEY = 'pvz_level_progress';
function loadLevelProgress() {
    try { return JSON.parse(localStorage.getItem(PROGRESS_KEY)) || { cleared:[] }; }
    catch (e) { return { cleared:[] }; }
}
function saveLevelProgress(progress) {
    try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress)); } catch (e) {}
}

function buildLevelGrid() {
    const grid = document.getElementById('levelGrid');
    grid.innerHTML = '';
    const isStory = menuState.mode === 'story';
    const data = isStory ? LEVELS : CHALLENGES;
    const prog = loadLevelProgress();
    document.getElementById('menuSubtitle').textContent =
        isStory ? '主线关卡 · 通关当前关卡解锁下一关' : '挑战模式 · 全部开放，敢来试试吗';
    document.getElementById('lsTitle').textContent = isStory ? '冒险模式' : '挑战模式';
    document.getElementById('lsCount').textContent =
        prog.cleared.filter(id => data.some(l => l.id === id)).length + ' / ' + data.length + ' 通关';

    data.forEach((lvl, idx) => {
        let isUnlocked = true;
        let isCleared = false;
        if (isStory) {
            isUnlocked = idx === 0 || prog.cleared.includes(data[idx - 1].id);
            isCleared = prog.cleared.includes(lvl.id);
        } else {
            isCleared = prog.cleared.includes(lvl.id);
        }
        if (idx === 0 && !data.find(l => l.id === menuState.selectedLevel)) {
            menuState.selectedLevel = data[0].id;
        }
        const card = document.createElement('div');
        card.className = 'level-card';
        if (!isUnlocked) card.classList.add('locked');
        if (lvl.id === menuState.selectedLevel && isUnlocked) card.classList.add('active');

        const top = lvl.bgTop || '#8bc34a';
        const bot = lvl.bgBottom || '#558b2f';
        const icons = isStory ? ['🌻', '🌙', '🏊', '🏠', '👻', '🔥'] : ['⚔️', '🛡️', '🌙', '💀'];
        const icon = isStory ? (icons[idx] || '🌻') : (icons[idx] || '🏆');
        card.innerHTML = `
            <div class="pc-ribbon ${isCleared ? 'done' : ''}"></div>
            <div class="pc-art" style="background:linear-gradient(180deg,${top},${bot})"><span>${icon}</span></div>
            <div class="pc-label">${lvl.name}</div>
            <div class="pc-desc">${lvl.desc}</div>
            ${isCleared ? '<div class="lc-stars">⭐⭐⭐</div>' : ''}
        `;

        if (isUnlocked) {
            card.addEventListener('click', () => {
                menuState.selectedLevel = lvl.id;
                document.querySelectorAll('.level-card').forEach(c => c.classList.remove('active'));
                card.classList.add('active');
            });
        }
        grid.appendChild(card);
    });
}

function refreshPlaques() {
    const prog = loadLevelProgress();
    const storyCleared = LEVELS.filter(l => prog.cleared.includes(l.id)).length;
    const sub = document.getElementById('spSub');
    if (storyCleared >= LEVELS.length) {
        sub.textContent = '全关通关！';
    } else {
        let nextIdx = 0;
        while (nextIdx < LEVELS.length && prog.cleared.includes(LEVELS[nextIdx].id)) nextIdx++;
        sub.textContent = '第 ' + (nextIdx + 1) + ' 关 · ' + LEVELS[nextIdx].name;
    }
    const chDone = CHALLENGES.filter(l => prog.cleared.includes(l.id)).length;
    document.getElementById('spSubCh').textContent = chDone + '/' + CHALLENGES.length + ' 通关';
}

function openLevelSelect(mode) {
    menuState.mode = mode;
    const data = mode === 'story' ? LEVELS : CHALLENGES;
    menuState.selectedLevel = data[0].id;
    buildLevelGrid();
    document.getElementById('levelSelect').style.display = 'flex';
    document.getElementById('mainMenu').style.display = 'none';
}

function backToMainMenu() {
    document.getElementById('levelSelect').style.display = 'none';
    document.getElementById('mainMenu').style.display = 'block';
    refreshPlaques();
}

// ============ HUD ============
const cardEls = []; // 缓存卡片元素与冷却条引用
function buildPlantCards() {
    const c = document.getElementById('plantCards');
    c.innerHTML = '';
    cardEls.length = 0;
    PLANT_ORDER.forEach((type, idx) => {
        const def = PLANT_DEFS[type];
        const card = document.createElement('div');
        card.className = 'plant-card';
        card.dataset.type = type;

        const cc = document.createElement('canvas');
        cc.width = 50; cc.height = 50;
        drawPlantIcon(cc.getContext('2d'), type, 50);
        card.appendChild(cc);

        const cost = document.createElement('div');
        cost.className = 'cost';
        cost.textContent = def.cost;
        card.appendChild(cost);

        const kb = document.createElement('div');
        kb.className = 'keybind';
        kb.textContent = idx + 1;
        card.appendChild(kb);

        const cd = document.createElement('div');
        cd.className = 'cooldown';
        card.appendChild(cd);

        card.addEventListener('mouseenter', (e) => {
            if (state.scene === 'playing') showPlantTooltip(type, e);
        });
        card.addEventListener('mousemove', (e) => {
            if (state.scene === 'playing') movePlantTooltip(e);
        });
        card.addEventListener('mouseleave', () => { hidePlantTooltip(); });

        card.addEventListener('click', () => {
            if (state.scene !== 'playing' || state.paused) return;
            if (state.cardCooldowns[type] > 0) { showToast('植物冷却中...'); sfx.play('error'); return; }
            if (state.sun < def.cost) { showToast('阳光不足！'); sfx.play('error'); return; }
            state.selectedPlantType = state.selectedPlantType === type ? null : type;
            state.shovelSelected = false;
            updateCardSelection();
            dom.shovel.classList.remove('selected');
            hidePlantTooltip();
        });
        
        // 拖拽种植
        card.draggable = true;
        card.addEventListener('dragstart', (e) => {
            if (state.scene !== 'playing' || state.paused) return;
            if (state.cardCooldowns[type] > 0 || state.sun < def.cost) { e.preventDefault(); return; }
            dragType = type;
            e.dataTransfer.effectAllowed = 'copy';
            e.dataTransfer.setData('text/plain', type);
            // 选中对应卡片视觉
            state.selectedPlantType = type;
            state.shovelSelected = false;
            updateCardSelection();
            dom.shovel.classList.remove('selected');
        });
        card.addEventListener('dragend', () => {
            dragType = null;
        });

        c.appendChild(card);
        cardEls.push({ card, cd, type });
    });
}

function drawPlantIcon(ctx, type, size) {
    ctx.clearRect(0, 0, size, size);
    const cx = size / 2, cy = size / 2 + 3;
    
    if (type === 'sunflower') {
        ctx.fillStyle = '#ffc107';
        for (let i = 0; i < 8; i++) {
            const a = (i / 8) * Math.PI * 2;
            ctx.beginPath();
            ctx.ellipse(cx + Math.cos(a) * 14, cy + Math.sin(a) * 14, 7, 4, a, 0, Math.PI*2);
            ctx.fill();
        }
        ctx.fillStyle = '#ff8f00';
        ctx.beginPath(); ctx.arc(cx, cy, 11, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#3e2723';
        ctx.beginPath(); ctx.arc(cx - 3, cy - 1, 1.5, 0, Math.PI*2); ctx.arc(cx + 3, cy - 1, 1.5, 0, Math.PI*2); ctx.fill();
    } else if (type === 'peashooter') {
        ctx.fillStyle = '#558b2f'; ctx.fillRect(cx - 2, cy + 5, 4, 14);
        ctx.fillStyle = '#66bb6a';
        ctx.beginPath(); ctx.arc(cx, cy - 3, 13, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#2e7d32';
        ctx.beginPath(); ctx.ellipse(cx + 11, cy - 3, 5, 6, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(cx - 2, cy - 6, 2.5, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#3e2723';
        ctx.beginPath(); ctx.arc(cx - 1, cy - 6, 1.5, 0, Math.PI*2); ctx.fill();
    } else if (type === 'wallnut') {
        ctx.fillStyle = '#a1887f';
        ctx.beginPath(); ctx.ellipse(cx, cy + 2, 17, 20, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#3e2723';
        ctx.beginPath(); ctx.arc(cx - 6, cy, 2, 0, Math.PI*2); ctx.arc(cx + 6, cy, 2, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#3e2723'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(cx, cy + 5, 4, 0.2, Math.PI - 0.2); ctx.stroke();
    } else if (type === 'cherrybomb') {
        ctx.fillStyle = '#c62828';
        ctx.beginPath(); ctx.arc(cx - 7, cy + 5, 11, 0, Math.PI*2); ctx.arc(cx + 7, cy + 5, 11, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#558b2f'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(cx - 7, cy - 6); ctx.quadraticCurveTo(cx, cy - 14, cx + 7, cy - 6); ctx.stroke();
        ctx.fillStyle = '#7cb342';
        ctx.beginPath(); ctx.ellipse(cx, cy - 14, 5, 2, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(cx - 7, cy + 3, 2.5, 0, Math.PI*2); ctx.arc(cx + 7, cy + 3, 2.5, 0, Math.PI*2); ctx.fill();
    } else if (type === 'iceshooter') {
        ctx.fillStyle = '#558b2f'; ctx.fillRect(cx - 2, cy + 5, 4, 14);
        ctx.fillStyle = '#29b6f6';
        ctx.beginPath(); ctx.arc(cx, cy - 3, 13, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#0277bd';
        ctx.beginPath(); ctx.ellipse(cx + 11, cy - 3, 5, 6, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(cx - 2, cy - 6, 2.5, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#01579b';
        ctx.beginPath(); ctx.arc(cx - 1, cy - 6, 1.5, 0, Math.PI*2); ctx.fill();
        ctx.font = '8px sans-serif'; ctx.fillText('❄', cx - 12, cy + 5);
    } else if (type === 'repeater') {
        ctx.fillStyle = '#558b2f'; ctx.fillRect(cx - 2, cy + 5, 4, 14);
        ctx.fillStyle = '#388e3c';
        ctx.beginPath(); ctx.arc(cx, cy - 3, 13, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#1b5e20';
        ctx.beginPath(); ctx.ellipse(cx + 11, cy - 6, 4, 4, 0, 0, Math.PI*2); ctx.ellipse(cx + 11, cy + 1, 4, 4, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(cx - 2, cy - 6, 2.5, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#3e2723';
        ctx.beginPath(); ctx.arc(cx - 1, cy - 6, 1.5, 0, Math.PI*2); ctx.fill();
    } else if (type === 'cotton') {
        const blobs = [
            { dx: -8, dy: -3, r: 8 },
            { dx: 8, dy: -3, r: 8 },
            { dx: 0, dy: -8, r: 9 },
            { dx: 0, dy: 2, r: 9 },
        ];
        ctx.fillStyle = '#558b2f'; ctx.fillRect(cx - 1.5, cy + 5, 3, 10);
        for (const b of blobs) {
            ctx.fillStyle = '#eceff1';
            ctx.beginPath(); ctx.arc(cx + b.dx, cy + b.dy, b.r, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            ctx.beginPath(); ctx.arc(cx + b.dx - b.r*0.3, cy + b.dy - b.r*0.3, b.r*0.4, 0, Math.PI*2); ctx.fill();
        }
    }
}

function updateHUD() {
    dom.sunAmount.textContent = state.sun;
    for (const { card, cd, type } of cardEls) {
        const def = PLANT_DEFS[type];
        const cdt = state.cardCooldowns[type];
        if (cdt > 0) {
            card.classList.add('disabled');
            cd.style.transform = `scaleY(${cdt / def.cooldown})`;
        } else {
            if (state.sun >= def.cost) card.classList.remove('disabled');
            else card.classList.add('disabled');
            cd.style.transform = 'scaleY(0)';
        }
    }

    const progress = Math.min(state.wave / WAVES.length, 1);
    dom.progressFill.style.width = `${progress * 100}%`;
    dom.progressZombie.style.left = `${progress * 100}%`;
    if (state.endless) {
        dom.waveLabel.textContent = `∞${state.wave}`;
    } else {
        dom.waveLabel.textContent = `${Math.min(state.wave, WAVES.length)}/${WAVES.length}`;
    }

    // 本波剩余僵尸数
    if (state.scene === 'playing' && state.waveInProgress) {
        const remaining = (state.waveZombies ? state.waveZombies.length - state.waveSpawnIndex : 0) + state.zombies.length;
        dom.remainLabel.textContent = `本波剩余 ${remaining}`;
    } else {
        dom.remainLabel.textContent = '';
    }

    dom.autoSunBtn.classList.toggle('on', state.autoSun);
}

function updateCardSelection() {
    for (const { card, type } of cardEls) {
        card.classList.toggle('selected', type === state.selectedPlantType);
    }
}

// ============ 事件 ============
function setupEvents() {
    canvas.addEventListener('mousemove', (e) => {
        const r = canvas.getBoundingClientRect();
        const sx = canvas.width / r.width, sy = canvas.height / r.height;
        state.mouseX = (e.clientX - r.left) * sx;
        state.mouseY = (e.clientY - r.top) * sy;
        state.hoverCell = getCellAt(state.mouseX, state.mouseY);
    });
    canvas.addEventListener('mouseleave', () => { state.hoverCell = null; });
    
    // 拖拽放置
    canvas.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
    canvas.addEventListener('drop', (e) => {
        e.preventDefault();
        if (state.scene !== 'playing' || state.paused) return;
        const type = dragType || e.dataTransfer.getData('text/plain');
        if (!type || !PLANT_DEFS[type]) return;
        const r = canvas.getBoundingClientRect();
        const sx = canvas.width / r.width, sy = canvas.height / r.height;
        const x = (e.clientX - r.left) * sx;
        const y = (e.clientY - r.top) * sy;
        const cell = getCellAt(x, y);
        if (!cell) return;
        const def = PLANT_DEFS[type];
        // 棉花堆叠
        if (type === 'cotton') {
            const existing = findPlantAt(cell.row, cell.col);
            if (existing && existing.type === 'cotton' && existing.stack < 3) {
                if (state.sun < def.cost) { showToast('阳光不足！'); sfx.play('error'); return; }
                existing.stack++;
                existing.maxHp = existing.stack * def.hp;
                existing.hp = existing.maxHp;
                existing.clogBaseTimer = def.lifetime * existing.stack;
                if (existing.targetZombies.length > 0) {
                    existing.clogTimer = existing.clogBaseTimer / existing.targetZombies.length;
                }
                state.sun -= def.cost;
                state.cardCooldowns[type] = def.cooldown;
                sfx.play('plant');
                const names = ['', '棉花', '棉球', '棉被'];
                showToast(`${names[existing.stack]}！强度提升！`);
                const c = getCellCenter(cell.row, cell.col);
                for (let i = 0; i < 12; i++) {
                    state.particles.push(createParticle(c.x, c.y + 25, '#e1bee7',
                        (Math.random()-0.5)*3, -Math.random()*2, 3, 400));
                }
                state.selectedPlantType = null; dragType = null; updateCardSelection();
                return;
            }
        }
        if (findPlantAt(cell.row, cell.col)) { showToast('此处已有植物！'); sfx.play('error'); return; }
        if (state.sun < def.cost) { showToast('阳光不足！'); sfx.play('error'); return; }
        if (state.cardCooldowns[type] > 0) { showToast('植物冷却中！'); sfx.play('error'); return; }
        state.plants.push(createPlant(type, cell.row, cell.col));
        state.sun -= def.cost;
        state.cardCooldowns[type] = def.cooldown;
        sfx.play('plant');
        const c = getCellCenter(cell.row, cell.col);
        for (let i = 0; i < 12; i++) {
            state.particles.push(createParticle(c.x, c.y + 25, '#558b2f',
                (Math.random()-0.5)*3, -Math.random()*2, 3, 400));
        }
        state.selectedPlantType = null;
        dragType = null;
        updateCardSelection();
    });
    
    canvas.addEventListener('click', (e) => {
        if (state.scene !== 'playing' || state.paused) return;
        const r = canvas.getBoundingClientRect();
        const sx = canvas.width / r.width, sy = canvas.height / r.height;
        const x = (e.clientX - r.left) * sx;
        const y = (e.clientY - r.top) * sy;
        
        for (let i = state.suns.length - 1; i >= 0; i--) {
            const s = state.suns[i];
            if (Math.hypot(x - s.x, y - s.y) < 28) { collectSun(s); return; }
        }
        
        const cell = getCellAt(x, y);
        if (!cell) return;
        
        if (state.shovelSelected) {
            const p = findPlantAt(cell.row, cell.col);
            if (p) {
                p.dead = true;
                state.shovelSelected = false;
                dom.shovel.classList.remove('selected');
                const c = getCellCenter(cell.row, cell.col);
                for (let i = 0; i < 10; i++) {
                    state.particles.push(createParticle(c.x, c.y + 20, '#8d6e63',
                        (Math.random()-0.5)*4, -Math.random()*3, 3, 400));
                }
            }
            return;
        }
        
        if (state.selectedPlantType) {
            const def = PLANT_DEFS[state.selectedPlantType];
            // 棉花堆叠：同格已有棉花则升级
            if (state.selectedPlantType === 'cotton') {
                const existing = findPlantAt(cell.row, cell.col);
                if (existing && existing.type === 'cotton' && existing.stack < 3) {
                    if (state.sun < def.cost) { showToast('阳光不足！'); sfx.play('error'); return; }
                    existing.stack++;
                    existing.maxHp = existing.stack * def.hp;
                    existing.hp = existing.maxHp;
                    existing.clogBaseTimer = def.lifetime * existing.stack;
                    // 重新计算当前已塞僵尸的剩余时间
                    if (existing.targetZombies.length > 0) {
                        existing.clogTimer = existing.clogBaseTimer / existing.targetZombies.length;
                    }
                    state.sun -= def.cost;
                    state.cardCooldowns[state.selectedPlantType] = def.cooldown;
                    sfx.play('plant');
                    const names = ['', '棉花', '棉球', '棉被'];
                    showToast(`${names[existing.stack]}！强度提升！`);
                    const c = getCellCenter(cell.row, cell.col);
                    for (let i = 0; i < 12; i++) {
                        state.particles.push(createParticle(c.x, c.y + 25, '#e1bee7',
                            (Math.random()-0.5)*3, -Math.random()*2, 3, 400));
                    }
                    state.selectedPlantType = null;
                    updateCardSelection();
                    return;
                }
            }
            if (findPlantAt(cell.row, cell.col)) { showToast('此处已有植物！'); sfx.play('error'); return; }
            if (state.sun < def.cost) { showToast('阳光不足！'); sfx.play('error'); return; }
            if (state.cardCooldowns[state.selectedPlantType] > 0) { showToast('植物冷却中！'); sfx.play('error'); return; }
            
            state.plants.push(createPlant(state.selectedPlantType, cell.row, cell.col));
            state.sun -= def.cost;
            state.cardCooldowns[state.selectedPlantType] = def.cooldown;
            sfx.play('plant');
            
            const c = getCellCenter(cell.row, cell.col);
            for (let i = 0; i < 12; i++) {
                state.particles.push(createParticle(c.x, c.y + 25, '#558b2f',
                    (Math.random()-0.5)*3, -Math.random()*2, 3, 400));
            }
            state.selectedPlantType = null;
            updateCardSelection();
        }
    });
    
    dom.shovel.addEventListener('click', () => {
        if (state.scene !== 'playing' || state.paused) return;
        state.shovelSelected = !state.shovelSelected;
        if (state.shovelSelected) state.selectedPlantType = null;
        updateCardSelection();
        dom.shovel.classList.toggle('selected', state.shovelSelected);
    });
    
    dom.autoSunBtn.addEventListener('click', () => {
        if (state.scene !== 'playing') return;
        state.autoSun = !state.autoSun;
        menuState.autoSun = state.autoSun;
        updateHUD();
        showToast(state.autoSun ? '自动收取阳光已开启' : '自动收取阳光已关闭');
    });
    
    dom.muteBtn.addEventListener('click', () => {
        settings.muted = !settings.muted;
        saveSettings();
        applyMuteUI();
        if (settings.muted) { bgm.stop(); } else if (state.scene === 'playing' && !state.paused) { bgm.start(); }
        showToast(settings.muted ? '已静音' : '已开启音效');
    });
    
    // 墓碑石板按钮（原版主菜单交互）
    document.querySelectorAll('.stone-plaque').forEach(btn => {
        btn.addEventListener('click', () => {
            const m = btn.dataset.menu;
            if (m === 'story' || m === 'challenge') openLevelSelect(m);
            else if (m === 'endless') {
                document.getElementById('mainMenu').style.display = 'none';
                startEndless();
            }
        });
    });

    // 难度选择（主菜单底部石条）
    document.querySelectorAll('.stone-mini').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.stone-mini').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            menuState.difficulty = btn.dataset.diff;
        });
    });

    // 自动收取开关
    document.getElementById('autoSunToggle').addEventListener('click', () => {
        menuState.autoSun = !menuState.autoSun;
        document.querySelector('#autoSunToggle .toggle-track').classList.toggle('on', menuState.autoSun);
    });

    // 选关界面
    document.getElementById('startBtn').addEventListener('click', () => {
        document.getElementById('mainMenu').style.display = 'none';
        document.getElementById('levelSelect').style.display = 'none';
        startGame(false);
    });
    document.getElementById('lsBackBtn').addEventListener('click', backToMainMenu);
    document.getElementById('restartBtn').addEventListener('click', () => {
        document.getElementById('gameOver').style.display = 'none';
        document.getElementById('hud').style.display = 'none';
        document.getElementById('progressBar').style.display = 'none';
        document.getElementById('pauseBtn').style.display = 'none';
        backToMainMenu();
    });
    document.getElementById('endlessBtn').addEventListener('click', () => {
        document.getElementById('gameOver').style.display = 'none';
        startEndless();
    });
    dom.pauseBtn.addEventListener('click', togglePause);
    
    document.addEventListener('keydown', (e) => {
        if (state.scene !== 'playing') return;
        if (e.key === 'Escape') {
            state.selectedPlantType = null;
            state.shovelSelected = false;
            updateCardSelection();
            dom.shovel.classList.remove('selected');
        }
        if (e.key >= '1' && e.key <= '9') {
            const idx = parseInt(e.key) - 1;
            if (idx < PLANT_ORDER.length) {
                const type = PLANT_ORDER[idx];
                const def = PLANT_DEFS[type];
                if (state.cardCooldowns[type] <= 0 && state.sun >= def.cost) {
                    state.selectedPlantType = type;
                    state.shovelSelected = false;
                    updateCardSelection();
                    dom.shovel.classList.remove('selected');
                }
            }
        }
        if (e.key === ' ') { e.preventDefault(); togglePause(); }
    });
}

function togglePause() {
    if (state.scene !== 'playing') return;
    state.paused = !state.paused;
    dom.pauseBtn.textContent = state.paused ? '▶' : '| |';
    dom.pauseOverlay.classList.toggle('show', state.paused);
    if (state.paused) bgm.pause(); else bgm.resume();
}

function collectSun(s) {
    if (s.collected) return;
    s.collected = true;
    state.sun += s.value;
    sfx.play('sun');
    
    const startX = s.x, startY = s.y;
    const targetX = 60, targetY = 55;
    const duration = 400;
    const startTime = performance.now();
    
    function animate() {
        if (state.scene !== 'playing' && state.scene !== 'won' && state.scene !== 'lost') return;
        const elapsed = performance.now() - startTime;
        const t = Math.min(elapsed / duration, 1);
        const e = 1 - Math.pow(1 - t, 3);
        s.x = startX + (targetX - startX) * e;
        s.y = startY + (targetY - startY) * e;
        s.life = 100;
        if (t < 1) requestAnimationFrame(animate);
    }
    animate();
    
    for (let i = 0; i < 10; i++) {
        state.particles.push(createParticle(startX, startY, '#ffeb3b',
            (Math.random()-0.5)*4, -Math.random()*3, 3, 400));
    }
}

// ============ 背景音乐（Web Audio 程序化合成） ============
const bgm = {
    nodes: [],
    started: false,
    ctx: null,
    _ensureCtx() {
        if (this.ctx) return;
        try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
        catch (e) { this.ctx = null; }
    },
    start() {
        if (this.started || settings.muted) return;
        this._ensureCtx();
        if (!this.ctx) return;
        this.stop();
        this.started = true;
        const t0 = this.ctx.currentTime;

        // 1. 低音 drone（55Hz 基音，缓慢起伏）
        const osc1 = this.ctx.createOscillator();
        const gain1 = this.ctx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(55, t0);
        gain1.gain.setValueAtTime(0, t0);
        gain1.gain.linearRampToValueAtTime(0.08, t0 + 2);
        // LFO 让音量缓慢呼吸
        const lfo1 = this.ctx.createOscillator();
        const lfoGain1 = this.ctx.createGain();
        lfo1.frequency.setValueAtTime(0.15, t0);
        lfoGain1.gain.setValueAtTime(0.04, t0);
        lfo1.connect(lfoGain1);
        lfoGain1.connect(gain1.gain);
        osc1.connect(gain1);
        gain1.connect(this.ctx.destination);
        osc1.start(t0); lfo1.start(t0);
        this.nodes.push(osc1, gain1, lfo1, lfoGain1);

        // 2. 泛音 drone（110Hz，带缓慢移调）
        const osc2 = this.ctx.createOscillator();
        const gain2 = this.ctx.createGain();
        osc2.type = 'triangle';
        osc2.frequency.setValueAtTime(110, t0);
        osc2.frequency.linearRampToValueAtTime(108, t0 + 8);
        osc2.frequency.linearRampToValueAtTime(112, t0 + 16);
        gain2.gain.setValueAtTime(0, t0);
        gain2.gain.linearRampToValueAtTime(0.05, t0 + 3);
        gain2.gain.linearRampToValueAtTime(0.03, t0 + 10);
        gain2.gain.linearRampToValueAtTime(0.05, t0 + 20);
        // 低通滤波让音色柔和
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(400, t0);
        osc2.connect(filter);
        filter.connect(gain2);
        gain2.connect(this.ctx.destination);
        osc2.start(t0);
        this.nodes.push(osc2, gain2, filter);
    },
    stop() {
        this.started = false;
        for (const n of this.nodes) {
            try { n.disconnect(); } catch (e) {}
            try { if (n.stop) n.stop(); } catch (e) {}
        }
        this.nodes = [];
    },
    pause() { this.stop(); },
    resume() { if (!settings.muted) this.start(); },
};

// ============ 音效（Web Audio 程序化合成） ============
const sfx = {
    ctx: null,
    init() {
        if (this.ctx) return;
        try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
        catch (e) { this.ctx = null; }
    },
    // 基础：单音
    tone(freq, dur, type = 'sine', vol = 0.2, slideTo = null) {
        if (settings.muted) return;
        this.init();
        if (!this.ctx) return;
        const t0 = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t0);
        if (slideTo !== null) osc.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t0 + dur);
        gain.gain.setValueAtTime(vol, t0);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(t0); osc.stop(t0 + dur);
    },
    // 噪声（用于爆炸/击杀）
    noise(dur, vol = 0.2, filterFreq = 1000) {
        if (settings.muted) return;
        this.init();
        if (!this.ctx) return;
        const t0 = this.ctx.currentTime;
        const bufferSize = Math.floor(this.ctx.sampleRate * dur);
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
        const src = this.ctx.createBufferSource(); src.buffer = buffer;
        const filter = this.ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = filterFreq;
        const gain = this.ctx.createGain(); gain.gain.setValueAtTime(vol, t0);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        src.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
        src.start(t0); src.stop(t0 + dur);
    },
    play(name) {
        switch (name) {
            case 'plant':    this.tone(420, 0.12, 'triangle', 0.18, 620); break;
            case 'shoot':    this.tone(700, 0.06, 'square', 0.07, 400); break;
            case 'sun':      this.tone(880, 0.1, 'sine', 0.16, 1320); setTimeout(()=>this.tone(1320,0.08,'sine',0.12),60); break;
            case 'clog':     this.tone(300, 0.15, 'sawtooth', 0.14, 180); break;
            case 'zombieDie':this.noise(0.25, 0.18, 700); break;
            case 'explosion':this.noise(0.5, 0.35, 1800); this.tone(120, 0.5, 'sawtooth', 0.2, 40); break;
            case 'error':    this.tone(200, 0.12, 'square', 0.12, 150); break;
            case 'wave':     this.tone(330, 0.15, 'triangle', 0.18); setTimeout(()=>this.tone(440,0.18,'triangle',0.18),120); break;
            case 'win':      [523,659,784,1047].forEach((f,i)=>setTimeout(()=>this.tone(f,0.25,'triangle',0.2),i*150)); break;
            case 'lose':     [400,330,260,180].forEach((f,i)=>setTimeout(()=>this.tone(f,0.3,'sawtooth',0.18),i*180)); break;
        }
    }
};

// ============ 本地最高分 ============
const BEST_KEY = 'pvz_best_scores_v1';
function loadBestScores() {
    try { return JSON.parse(localStorage.getItem(BEST_KEY)) || {}; }
    catch (e) { return {}; }
}
function saveBestScores(scores) {
    try { localStorage.setItem(BEST_KEY, JSON.stringify(scores)); } catch (e) {}
}
function updateBestScores(won) {
    const best = loadBestScores();
    const diff = state.difficulty;
    const diffBestKey = 'wave_' + diff;
    const killKey = 'kills_' + diff;
    const endlessKey = 'endless_wave';
    const clearedKey = 'cleared_' + diff;
    const records = { newRecords: [] };
    if (state.endless) {
        if (!best[endlessKey] || state.wave > best[endlessKey]) {
            best[endlessKey] = state.wave;
            records.newRecords.push('无尽最远波次');
        }
        records.endlessWave = state.wave;
    }
    if (!best[diffBestKey] || state.wave > best[diffBestKey]) {
        best[diffBestKey] = state.wave;
        records.newRecords.push(`${DIFFICULTY[diff].name}最远波次`);
    }
    records.waveBest = best[diffBestKey];
    if (!best[killKey] || state.zombiesKilled > best[killKey]) {
        best[killKey] = state.zombiesKilled;
        records.newRecords.push('单局击杀数');
    }
    records.killsBest = best[killKey];
    if (won && !state.endless) {
        const cleared = best[clearedKey] || 0;
        best[clearedKey] = cleared + 1;
        records.cleared = best[clearedKey];
    }
    records.diffName = DIFFICULTY[diff].name;
    saveBestScores(best);
    return records;
}
function renderBestScores(records) {
    const best = loadBestScores();
    const diff = state.difficulty;
    const diffName = DIFFICULTY[diff].name;
    const lines = [];
    const waveBest = best['wave_' + diff] || 0;
    const killsBest = best['kills_' + diff] || 0;
    const endlessWave = best['endless_wave'] || 0;
    const cleared = best['cleared_' + diff] || 0;
    lines.push(`<div>历史最佳 · ${diffName}：最远 <strong>${waveBest}</strong> 波 · 击杀 <strong>${killsBest}</strong></div>`);
    if (endlessWave > 0) lines.push(`<div>无尽模式最远：<strong>${endlessWave}</strong> 波</div>`);
    if (cleared > 0) lines.push(`<div>${diffName}通关次数：<strong>${cleared}</strong></div>`);
    if (records.newRecords && records.newRecords.length) {
        lines.push(`<div class="new-record">★ 新纪录：${records.newRecords.join('、')}！</div>`);
    }
    return lines.join('');
}

// ============ 设置（静音持久化） ============
function loadSettings() {
    try {
        const s = JSON.parse(localStorage.getItem('pvz_settings_v1'));
        if (s && typeof s.muted === 'boolean') settings.muted = s.muted;
    } catch (e) {}
}
function saveSettings() {
    try { localStorage.setItem('pvz_settings_v1', JSON.stringify(settings)); } catch (e) {}
}
function applyMuteUI() {
    dom.muteIcon.textContent = settings.muted ? '✕' : '♪';
    dom.muteBtn.style.opacity = settings.muted ? '0.5' : '1';
}

// ============ 启动 ============
function buildBackgroundCache() {
    bgCanvas = document.createElement('canvas');
    bgCanvas.width = CONFIG.CANVAS_W;
    bgCanvas.height = CONFIG.CANVAS_H;
    drawStaticBackground(bgCanvas.getContext('2d'));
}

function startGame(endless) {
    initState();
    state.scene = 'playing';
    state.endless = !!endless;
    state.waveTimer = 4000;
    if (endless) state.wave = WAVES.length;
    // 显示HUD和进度条
    document.getElementById('hud').style.display = '';
    document.getElementById('progressBar').style.display = '';
    document.getElementById('pauseBtn').style.display = '';
    // 应用关卡背景
    const allLevels = [...LEVELS, ...CHALLENGES];
    const lvl = allLevels.find(l => l.id === state.levelId) || LEVELS[0];
    document.getElementById('game').style.background = `linear-gradient(to bottom, ${lvl.bgTop}, ${lvl.bgBottom})`;
    buildBackgroundCache();
    buildPlantCards();
    dom.pauseBtn.textContent = '| |';
    dom.pauseOverlay.classList.remove('show');
    bgm.start();
    const diffName = DIFFICULTY[state.difficulty].name;
    setTimeout(() => {
        if (state.scene === 'playing') {
            if (endless) showWaveBanner('无尽模式！', `${lvl.name} · ${diffName}难度`);
            else showWaveBanner(lvl.name, `${lvl.desc} · ${diffName}难度`);
        }
    }, 100);
}

function startEndless() {
    initState();
    state.scene = 'playing';
    state.endless = true;
    state.paused = false;
    state.waveInProgress = false;
    state.waveTimer = 4000;
    state.waveZombies = null;
    state.waveSpawnIndex = 0;
    document.getElementById('hud').style.display = '';
    document.getElementById('progressBar').style.display = '';
    document.getElementById('pauseBtn').style.display = '';
    const allLevels = [...LEVELS, ...CHALLENGES];
    const lvl = allLevels.find(l => l.id === state.levelId) || LEVELS[0];
    document.getElementById('game').style.background = `linear-gradient(to bottom, ${lvl.bgTop}, ${lvl.bgBottom})`;
    buildBackgroundCache();
    buildPlantCards();
    dom.pauseBtn.textContent = '| |';
    dom.pauseOverlay.classList.remove('show');
    showToast('无尽模式启动！撑得越久越好');
    bgm.start();
}

function gameLoop(now) {
    const dt = Math.min(now - state.lastTime, 100);
    state.lastTime = now;
    update(dt);
    render();
    requestAnimationFrame(gameLoop);
}

// 初始化
loadSettings();
cacheDom();
applyMuteUI();
initState();
setupEvents();
buildLevelGrid();
refreshPlaques();
// 菜单时不生成植物卡片
document.getElementById('game').style.background = '#1b5e20';
requestAnimationFrame(gameLoop);
</script>
